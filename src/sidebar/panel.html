<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickTick in Sidebar</title>
    <meta name="description" content="A sidebar panel for TickTick in Firefox." />
    <link rel="icon" type="image/png" href="./../icons/32x32.png" />
    <style>
        :root {
            --background-color: #f5f5f5;
            --text-color: #333;
            --error-color: #d73a49;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background-color: #333;
                --text-color: #f5f5f5;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            text-align: center;
        }

        #loading {
            color: var(--text-color);
            font-size: 14px;
            margin-top: 40px;
        }

        #error {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 40px;
            display: none;
        }
    </style>
</head>

<body>
    <main>
        <section id="loading">
            <p>Loading TickTick...</p>
        </section>
        <section id="error" style="display: none;">
            <p>Failed to load TickTick. Please try again.</p>
        </section>
    </main>

    <script src="panel.js"></script>
</body>

</html>
